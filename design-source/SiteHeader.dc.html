<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8F4EB;font-family:'Manrope',system-ui,sans-serif}
.hi{font-family:'Noto Sans Devanagari','Manrope',sans-serif}
.sr{font-family:'Newsreader',Georgia,serif}
</style></helmet>

<div style="position:sticky;top:0;z-index:40;background:#F8F4EB;border-bottom:1px solid rgba(176,134,60,.45)">
  <div style="background:#2F3E64;color:rgba(248,244,235,.82)">
    <div style="max-width:1280px;margin:0 auto;padding:8px clamp(18px,4vw,48px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 20px;font-size:clamp(10.5px,1.5vw,12.5px);letter-spacing:.06em">
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B0863C" stroke-width="1.6" style="flex:none"><path d="M12 3.5a8.5 8.5 0 100 17 8.5 8.5 0 000-17"></path><path d="M12 7.5V12l3 2"></path></svg>
        <span>Mon – Sat, 10 am – 5 pm · Sunday closed</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px">
        <a href="tel:+917481908030" style="color:#B0863C;font-weight:600;text-decoration:none">+91 7481 908 030</a>
        <a href="mailto:hopehomeoclinic15@gmail.com" style="color:rgba(248,244,235,.55);text-decoration:none">hopehomeoclinic15@gmail.com</a>
      </div>
    </div>
  </div>

  <div style="max-width:1280px;margin:0 auto;padding:clamp(12px,1.6vw,18px) clamp(18px,4vw,48px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <span style="flex:none;width:clamp(42px,4.2vw,56px);height:clamp(42px,4.2vw,56px);border-radius:50%;background:#2F3E64;box-shadow:inset 0 0 0 1px rgba(176,134,60,.55);display:flex;align-items:center;justify-content:center">
        <img src="assets/logo-gold.png" alt="Hope Homeo Clinic" style="width:62%;height:62%;object-fit:contain;display:block">
      </span>
      <span>
        <span class="sr" style="display:block;font-weight:600;font-size:clamp(14px,1.9vw,21px);line-height:1.05;letter-spacing:.13em;color:#2F3E64;white-space:nowrap"><span style="color:#0E6B54">HOPE</span> <span style="color:#B0863C">HOMEO</span> CLINIC</span>
        <span style="display:block;font-size:clamp(8.5px,1.1vw,10.5px);letter-spacing:.22em;text-transform:uppercase;color:#0E6B54;font-weight:700;margin-top:5px;white-space:nowrap">Power of Homoeopathy</span>
      </span>
    </a>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px clamp(14px,2vw,26px)">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="8">
        <a href="{{ l.href }}" style="text-decoration:none;font-size:clamp(11.5px,1.35vw,13.5px);font-weight:{{ l.weight }};letter-spacing:.06em;text-transform:uppercase;color:{{ l.color }};padding:6px 0;border-bottom:2px solid {{ l.rule }};white-space:nowrap">{{ l.label }}</a>
      </sc-for>
      <a href="book.dc.html" style="text-decoration:none;background:#2F3E64;color:#F8F4EB;padding:clamp(11px,1.2vw,15px) clamp(16px,2vw,26px);font-size:clamp(11.5px,1.3vw,13.5px);font-weight:600;letter-spacing:.04em;box-shadow:inset 0 0 0 1px rgba(176,134,60,.55);white-space:nowrap" style-hover="background:#0E6B54">Book appointment</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:160},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;treatments&quot;,&quot;diet&quot;,&quot;remedies&quot;,&quot;fees&quot;,&quot;contact&quot;,&quot;book&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const items = [
      ['home', 'Home', 'index.dc.html'],
      ['about', 'About', 'about.dc.html'],
      ['treatments', 'Treatments', 'treatments.dc.html'],
      ['diet', 'Diet charts', 'diet-charts.dc.html'],
      ['remedies', 'Remedies', 'remedies.dc.html'],
      ['fees', 'Fees', 'fees.dc.html'],
      ['contact', 'Contact', 'contact.dc.html'],
    ];
    return {
      links: items.map(([k, label, href]) => ({
        label, href,
        color: active === k ? '#2F3E64' : 'rgba(35,35,31,.72)',
        weight: active === k ? 700 : 500,
        rule: active === k ? '#B0863C' : 'transparent',
      })),
    };
  }
}
</script>
</body>
</html>
